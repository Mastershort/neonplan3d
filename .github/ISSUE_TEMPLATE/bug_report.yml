name: 🐞 Bug report / Fehler melden (only bugs / nur Fehler)
description: Something does not work as described in the manual. / Etwas funktioniert nicht wie in der Anleitung beschrieben.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Issues are for bugs only** – something that worked before or does not work as the manual says.
        > **Wishes and ideas** (a new piece of furniture, a new setting, "it would be nice if …") go to **[Discussions → Ideas](https://github.com/Mastershort/neonplan3d/discussions/categories/ideas)**, where others can vote with 👍. Wishes posted here are moved there.
        >
        > **Issues nur für Fehler** – etwas, das vorher ging oder nicht so funktioniert, wie die Anleitung sagt.
        > **Wünsche und Ideen** (ein neues Möbel, eine neue Einstellung, „es wäre schön, wenn …“) bitte in **[Diskussionen → Ideen](https://github.com/Mastershort/neonplan3d/discussions/categories/ideas)** – dort können andere mit 👍 abstimmen. Wünsche hier werden dorthin verschoben.

        Thanks for reporting! English or German, both are fine. / Danke für die Meldung! Deutsch oder Englisch, beides ist okay.
        Please do not post private data (addresses, IP addresses, real names of people). / Bitte keine privaten Daten posten.
  - type: checkboxes
    id: is_bug
    attributes:
      label: Bug, not a wish / Fehler, kein Wunsch
      options:
        - label: This is a bug, not a wish for something new. / Das ist ein Fehler, kein Wunsch nach etwas Neuem.
          required: true
  - type: input
    id: version
    attributes:
      label: NeonPlan 3D version / Version
      description: HACS → NeonPlan 3D, or Settings → Devices & services → NeonPlan 3D.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part? / Welcher Teil?
      description: Pick all that fit – it sorts your report automatically. / Alles auswählen, was passt – so wird die Meldung automatisch einsortiert.
      multiple: true
      options:
        - Plan editor / Grundriss & Editor
        - 3D view / 3D-Ansicht
        - Dashboard card / Dashboard-Karte
        - Devices & control / Geräte & Bedienung
        - Roof & solar fields / Dach & Solarfelder
        - Outdoor & garden / Außen & Garten
        - Furniture & packs / Möbel & Packs
        - Energy Pro / Energie Pro
        - Camera Cockpit / Kamera-Cockpit
        - Weather Outside / Wetter draußen
        - Sound & Cinema / Klang & Kino
        - Car Pro / Auto Pro
        - Live Screens / Live-Bildschirme
        - Shop & licence / Shop & Lizenz
        - Installation & update / Installation & Update
        - Other / Sonstiges
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens? / Was passiert?
      description: What did you do, what did you expect, what happened instead? / Was hast du gemacht, was hast du erwartet, was ist stattdessen passiert?
      placeholder: |
        1. Open the editor …
        2. Tap …
        3. …
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device / Gerät
      multiple: true
      options:
        - Desktop browser
        - Tablet (wall tablet / Wandtablet)
        - Phone / Handy
        - Home Assistant app
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, browser console or HA log / Screenshots, Browser-Konsole oder HA-Protokoll
      description: Optional. Drag images in here. Errors from the browser console (F12) help a lot. / Optional. Bilder einfach hineinziehen.
