name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and check budgets
        run: npm run build
      - name: Split-level navigation in desktop, phone and tablet views
        run: CHROME_PATH="$(command -v google-chrome)" npm run test:browser
      - name: Committed bundles are up to date
        run: git diff --exit-code -- ../custom_components/neonplan3d/frontend

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt ruff mypy
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: mypy custom_components/neonplan3d
      - run: pytest -q

  # The job above gets the newest test harness that still runs on Python 3.13 (an older Home Assistant). Current
  # Home Assistant needs Python 3.14 and checks schemas with Probatio: the tests run there too (pointed out by
  # hohoanganh). It only warns for now – a red run here means: look before the next release.
  python-current-ha:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS reads the repository from outside, which fails while it is private
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
