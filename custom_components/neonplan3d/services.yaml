ask:
  fields:
    text:
      required: true
      example: "Zeig das Wohnzimmer"
      selector:
        text:
    screen:
      required: false
      example: "Küche"
      selector:
        text:
    speak:
      required: false
      default: false
      selector:
        boolean:
announce:
  fields:
    message:
      required: true
      example: "Es hat geklingelt!"
      selector:
        text:
    rooms:
      required: false
      example: "Küche"
      selector:
        text:
          multiple: true
    floor:
      required: false
      example: "Obergeschoss"
      selector:
        text:
    ignore_quiet:
      required: false
      default: false
      selector:
        boolean:
    on_screens:
      required: false
      default: false
      selector:
        boolean:
    screens:
      required: false
      example: "Flur"
      selector:
        text:
          multiple: true
